<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#13294B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyAssets">
<meta name="description" content="MyAssets — บริหารภาระค่าใช้จ่ายทรัพย์สินส่วนบุคคล">
<title>MyAssets</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2313294B'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23C9A24A' stroke-width='3' stroke-dasharray='3 3'/%3E%3Ctext x='32' y='40' font-size='22' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='700'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#13294B; --navy2:#1F3A68; --gold:#B8892B; --gold-l:#C9A24A; --gold-s:#F5ECD7;
  --paper:#F6F7FA; --white:#fff; --ink:#18213A; --muted:#667085; --line:#E3E7EF; --line2:#EEF1F6;
  --red:#B42318; --red-s:#FDECEA; --green:#1E7B4F; --green-s:#E6F4EC; --blue:#2459A8; --blue-s:#E8EFFA; --grey:#98A2B3;
  --r:12px; --font:"IBM Plex Sans Thai",-apple-system,"Segoe UI",Tahoma,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy2)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3;font-weight:600}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px}
.hide{display:none!important}

/* layout */
.app{min-height:100%;display:flex}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px}
.brand-name{font-weight:700;letter-spacing:.2px;font-size:17px}
.brand-owner{font-size:12px;opacity:.75;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-act{display:flex;gap:8px;align-items:center}
.lang-btn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
.icon-btn{background:transparent;border:0;color:inherit;width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:rgba(127,127,127,.12)}
.view{flex:1;width:100%;max-width:980px;margin:0 auto;padding:16px 16px 96px}
.credit{text-align:center;font-size:11px;color:var(--grey);padding:10px 16px calc(84px + var(--sab))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--white);border-top:1px solid var(--line);display:flex;padding-bottom:var(--sab)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:11px;color:var(--muted);text-decoration:none}
.bnav a.on{color:var(--navy)} .bnav a.on svg{stroke:var(--gold)}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:232px;background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;padding:22px 14px;gap:26px}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav-i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.78);text-decoration:none}
  .nav-i:hover{background:rgba(255,255,255,.07)}
  .nav-i.on{background:rgba(255,255,255,.1);color:#fff} .nav-i.on svg{stroke:var(--gold-l)}
  .bnav,.m-only{display:none!important}
  .top{background:transparent;color:var(--ink);position:static;justify-content:flex-end;padding:14px 24px 0}
  .top .lang-btn{border-color:var(--line);color:var(--ink)}
  .view{padding:8px 28px 40px}
  .credit{padding:14px 16px 18px}
}

/* generic */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.page-head p{margin:2px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 16px;border:1px solid var(--line);background:var(--white);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.section{margin-top:22px}
.section-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-h a,.link{font-size:13px;color:var(--navy2);cursor:pointer;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .btn{margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.b-overdue{background:var(--red-s);color:var(--red)} .b-soon{background:var(--gold-s);color:#8A6418}
.b-open{background:var(--blue-s);color:var(--blue)} .b-waiting{background:var(--line2);color:var(--muted)}
.b-paid{background:var(--green-s);color:var(--green)} .b-skipped{background:var(--line2);color:var(--grey);text-decoration:line-through}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* banners */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:10px;margin-bottom:10px;font-size:14px;flex-wrap:wrap}
.banner.info{background:var(--blue-s);color:#183E77}
.banner.warn{background:var(--gold-s);color:#6E4F12}
.banner.bad{background:var(--red-s);color:var(--red)}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;cursor:pointer;text-align:left}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.stat small{display:block;font-size:12px;margin-top:2px}
.stat.bad b{color:var(--red)} .stat.soon b{color:#8A6418}

/* tax-disc carousel: the signature element */
.discs{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.disc{flex:none;width:138px;scroll-snap-align:start;text-align:center;cursor:pointer;background:none;border:0;padding:0}
.disc-ring{--c:var(--grey);width:118px;height:118px;margin:0 auto;border-radius:50%;padding:6px;background:conic-gradient(var(--c) calc(var(--p,0)*360deg),var(--line) 0)}
.disc-face{width:100%;height:100%;border-radius:50%;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.disc-face::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed var(--gold-l);opacity:.75}
.disc-face b{font-size:30px;line-height:1;font-weight:700;color:var(--navy)}
.disc-face span{font-size:11px;color:var(--muted);margin-top:3px}
.disc-face i{font-style:normal;font-size:10px;color:var(--muted);margin-bottom:2px}
.disc.s-overdue .disc-ring{--c:var(--red)} .disc.s-overdue .disc-face b{color:var(--red)}
.disc.s-soon .disc-ring{--c:var(--gold)} .disc.s-open .disc-ring{--c:var(--blue)}
.disc-cap{margin-top:8px;font-size:13px;font-weight:600;line-height:1.3}
.disc-cap small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.disc-amt{font-size:13px;margin-top:2px}

/* rows */
.rows{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line2);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:#FAFBFD}
.row-ic{width:38px;height:38px;border-radius:10px;background:var(--line2);display:grid;place-items:center;color:var(--navy);flex:none}
.row-main{flex:1;min-width:0}
.row-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{text-align:right;flex:none}
.row-r .amt{font-weight:600}
.month-h{font-size:13px;color:var(--muted);margin:16px 2px 6px;font-weight:500}

/* assets */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.acard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.acard:hover{border-color:#C9D1DF}
.acover{height:92px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--gold-l);display:grid;place-items:center;position:relative}
.acover svg{width:40px;height:40px;stroke-width:1.4}
.acover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.acard-b{padding:12px 14px}
.acard-b .row-s{white-space:normal}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 14px;overflow-x:auto}
.tab{background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-color:var(--gold);font-weight:600}
.hero{display:flex;gap:16px;align-items:center}
.hero .acover{width:84px;height:84px;border-radius:14px;flex:none}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;margin-bottom:12px}
.tl-i::before{content:"";position:absolute;left:-20px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--white);border:2px solid var(--gold)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--line2);border:1px solid var(--line);cursor:pointer}
.add-thumb{width:64px;height:64px;border-radius:8px;border:1.5px dashed #C3CBD8;display:grid;place-items:center;color:var(--muted);cursor:pointer;background:none}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal-d{aspect-ratio:1/1;max-height:84px;background:var(--white);border:1px solid var(--line2);border-radius:9px;padding:5px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;font-size:13px;text-align:left}
.cal-d.out{opacity:.35}
.cal-d.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal-d.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grey)}
.dot.overdue{background:var(--red)} .dot.soon{background:var(--gold)} .dot.open{background:var(--blue)} .dot.paid{background:var(--green)}

/* reports */
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.bar-stack{display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;min-height:2px;background:var(--line2)}
.bar-lbl{font-size:11px;color:var(--muted);text-align:center;margin-top:5px;white-space:nowrap}
.bar-val{font-size:10px;color:var(--muted);text-align:center;margin-bottom:3px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.hbar-t{height:10px;border-radius:5px;background:var(--line2);overflow:hidden}
.hbar-t i{display:block;height:100%;background:var(--navy)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:left}
table.t th{font-weight:500;color:var(--muted);font-size:13px}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
table.t td:first-child{min-width:110px}
.tw{overflow-x:auto}

/* forms & sheets */
.sheet-wrap{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--white);width:100%;max-width:560px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet.wide{max-width:720px}
.sheet-form{display:flex;flex-direction:column;min-height:0;flex:1}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:16px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;border-bottom:1px solid var(--line2)}
.sheet-body{padding:14px 18px;overflow-y:auto}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px calc(12px + var(--sab));border-top:1px solid var(--line2)}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.f>label,.flabel{font-size:13px;color:var(--muted);font-weight:500}
.f input:not([type=checkbox]):not([type=radio]),.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--white);min-height:42px}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(31,58,104,.12)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.hint{font-size:12px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px;margin:6px 0}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--navy);flex:none}
.tpl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.tpl .f2{margin-top:8px}
.tpl .f{margin-bottom:0}
.items .irow{display:grid;grid-template-columns:1fr 110px 34px;gap:6px;margin-bottom:6px}
.items input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.danger-zone{border:1px solid #F4C7C3;border-radius:var(--r);padding:14px;margin-top:10px}


/* data bar (auto-save status + backup buttons) */
.databar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--white);border-bottom:1px solid var(--line);font-size:13px}
.save-chip{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink);flex:1;min-width:0;text-align:left;font-size:13px}
.save-chip .sd{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 3px var(--green-s)}
.save-chip .sd.warn{background:var(--gold);box-shadow:0 0 0 3px var(--gold-s)}
.save-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.databar{flex-wrap:wrap}.save-chip{flex-basis:100%}.databar .btn{flex:1}}
@media (min-width:900px){.databar{margin:10px 28px 0;border:1px solid var(--line);border-radius:10px;max-width:980px;align-self:center;width:calc(100% - 56px)}}
details.more{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--white)}
details.more summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.more summary::after{content:"+";color:var(--gold);font-weight:700;font-size:18px;line-height:1}
details.more[open] summary::after{content:"–"}
details.more summary::-webkit-details-marker{display:none}
details.more>div{padding:0 14px 12px;font-size:14px}
.keypts{display:grid;gap:10px;margin:16px 0}
.keypt{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--paper);border-radius:10px;padding:10px 12px}
.keypt svg{color:var(--gold);margin-top:2px}
.row-ic{overflow:hidden}
.row-ic img{width:100%;height:100%;object-fit:cover}
.acover.pick{cursor:pointer}
.acover .pick-hint{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);background:rgba(19,41,75,.78);color:#fff;border-radius:6px;padding:1px 7px;font-size:10px;z-index:1;white-space:nowrap}
.top .icon-btn svg{width:21px;height:21px}


/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
a.stat{text-decoration:none;color:inherit;display:block}
.stat.bad b{color:var(--red)} .stat.soon b{color:#8A6418}
.filterbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:16px 0 0}
.filterbar .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chip{white-space:nowrap}
.dimsel{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dimsel select{padding:5px 10px}
.tm{position:relative;width:100%;border-radius:10px;overflow:hidden;background:var(--line2)}
.tm-t{position:absolute;border:1.5px solid var(--white);color:#fff;padding:6px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden;font-size:13px;line-height:1.3}
.tm-t:hover{filter:brightness(1.08)}
.tm-l{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tm-v{font-size:12px;opacity:.9;margin-top:2px}
.tm-legs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 16px;margin-top:12px}
.tm-leg{display:grid;grid-template-columns:12px 1fr auto 46px;gap:8px;align-items:center;background:none;border:0;padding:5px 0;text-align:left;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line2)}
.tm-leg i{width:12px;height:12px;border-radius:3px}
.tm-leg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-leg em{font-style:normal;color:var(--muted);text-align:right}
.crumbs{font-size:14px;margin-bottom:8px}
.tlx{overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-behavior:smooth}
.tlx-in{position:relative;height:260px;min-width:100%}
.tlx-line{position:absolute;left:0;right:0;top:129px;height:3px;border-radius:2px;background:var(--navy2);opacity:.85}
.tl-ev{position:absolute;top:0;width:132px;height:260px;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.tl-dot{position:absolute;left:58px;top:123px;width:15px;height:15px;border-radius:50%;background:var(--white);border:3px solid var(--grey);z-index:1}
.tl-ev.s-overdue .tl-dot{border-color:var(--red);background:var(--red)}
.tl-ev.s-soon .tl-dot{border-color:var(--gold)} .tl-ev.s-open .tl-dot{border-color:var(--blue)}
.tl-ev.s-paid .tl-dot{border-color:var(--green);background:var(--green)}
.tl-card{position:absolute;left:5px;right:5px;display:flex;flex-direction:column;gap:1px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:7px 9px;text-align:left;font-size:12px;line-height:1.35;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.tl-ev.up .tl-card{bottom:146px} .tl-ev.down .tl-card{top:146px}
.tl-card::after{content:"";position:absolute;left:calc(50% - .5px);width:1px;height:14px;background:#C5CCD8}
.tl-ev.up .tl-card::after{top:100%} .tl-ev.down .tl-card::after{bottom:100%}
.tl-card b{font-size:11px;color:var(--muted);font-weight:500}
.tl-card span{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl-card small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-card em{font-style:normal;font-weight:600}
.tl-ev.s-overdue .tl-card{border-color:#F1B5AE;background:#FFF8F7}
.tl-ev.s-paid .tl-card{opacity:.7}
.tl-ev:hover .tl-card{border-color:var(--navy2)}
.tl-ev.today{cursor:default}
.tl-ev.today::before{content:"";position:absolute;left:65px;top:30px;bottom:30px;border-left:2px dashed var(--gold)}
.tl-today{position:absolute;left:36px;top:6px;background:var(--gold);color:#fff;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600}
/* expandable rows */
.drow{border-top:1px solid var(--line2)} .drow:first-child{border-top:0}
.drow>summary{list-style:none} .drow>summary::-webkit-details-marker{display:none}
.drow>summary.row{border-top:0}
.chev{width:16px;flex:none;color:var(--muted);transition:transform .15s;align-self:center}
.chev::before{content:"";display:block;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:0 auto 3px}
.drow[open] .chev{transform:rotate(180deg)}
.drow[open]>summary{background:#F8F9FC}
.drow-b{padding:4px 16px 14px 64px;background:#F8F9FC;font-size:14px}
@media (max-width:560px){.drow-b{padding-left:16px}}

/* reports */

.repctl .f{margin-bottom:10px}

@media print{.bnav,.side,.top,.credit,.btn{display:none!important}.view{padding:0}}

<script>
'use strict';
/* ===== MyAssets — Create by Nattapol P. @2026 ===== */
const VERSION = '1.03';
const TERMS_VERSION = 1;
// ใส่ลิงก์ทางการหลังเปิด GitHub Pages แล้ว เช่น 'https://username.github.io/myassets/'
const OFFICIAL_URL = 'https://drnatt.github.io/myassets/';

let lang = 'th';
const L = (th, en) => (lang === 'en' ? en : th);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

/* ---------- dates (ISO yyyy-mm-dd, local) ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const addDaysISO = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
function addMonthsISO(s, n, anchor) {
  const d = pd(s); const day = anchor || d.getDate();
  const y = d.getFullYear(), m = d.getMonth() + n;
  const last = new Date(y, m + 1, 0).getDate();
  return iso(new Date(y, m, Math.min(day, last)));
}
function nextApr30() { const t = todayISO(); const y = new Date().getFullYear(); const d = `${y}-04-30`; return d >= t ? d : `${y + 1}-04-30`; }
const locale = () => (lang === 'en' ? 'en-GB' : 'th-TH');
const fmtDate = (s, long) => s ? pd(s).toLocaleDateString(locale(), long ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: 'numeric', month: 'short', year: 'numeric' }) : '–';
const fmtMonthY = (y, m, short) => new Date(y, m, 1).toLocaleDateString(locale(), short ? { month: 'short' } : { month: 'long', year: 'numeric' });
const fmtMoney = n => '฿' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const fmtShort = n => { n = Number(n || 0); if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'; if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'k'; return String(Math.round(n)); };
const fmtStamp = ms => ms ? new Date(ms).toLocaleString(locale(), { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : L('ยังไม่เคย', 'Never');

/* ---------- reference data ---------- */
const CATS = { tax: ['ภาษี', 'Tax'], insurance: ['ประกันภัย', 'Insurance'], fee: ['ค่าส่วนกลาง/ค่าธรรมเนียม', 'Fees'], loan: ['ค่างวด/สินเชื่อ', 'Loan'], maintenance: ['บำรุงรักษา', 'Maintenance'], other: ['อื่น ๆ', 'Other'] };
const CAT_COLOR = { tax: '#13294B', insurance: '#B8892B', fee: '#5B7BB5', loan: '#8C96A8', maintenance: '#2E7D5B', other: '#C5CCD8' };
const catName = c => L(...(CATS[c] || CATS.other));
const TYPES = { car: ['รถยนต์', 'Car'], moto: ['รถจักรยานยนต์', 'Motorcycle'], condo: ['คอนโด', 'Condo'], house: ['บ้าน/ทาวน์โฮม', 'House'], land: ['ที่ดิน', 'Land'], policy: ['กรมธรรม์ประกัน', 'Insurance policy'], other: ['อื่น ๆ', 'Other'] };
const typeName = t => L(...(TYPES[t] || TYPES.other));
const ACC_KINDS = { savings: ['ออมทรัพย์', 'Savings'], current: ['กระแสรายวัน', 'Current'], credit: ['บัตรเครดิต', 'Credit card'], cash: ['เงินสด', 'Cash'], ewallet: ['e-Wallet', 'e-Wallet'] };
const MKINDS = { periodic: ['บำรุงรักษาตามระยะ', 'Scheduled service'], repair: ['ซ่อม', 'Repair'], parts: ['เปลี่ยนอะไหล่/อุปกรณ์', 'Parts replaced'], check: ['ตรวจเช็ก', 'Inspection'], improve: ['ปรับปรุง/ตกแต่ง', 'Improvement'] };
const STATUS = { overdue: ['เกินกำหนด', 'Overdue'], soon: ['ใกล้ครบ', 'Due soon'], open: ['เปิดให้จ่าย', 'Payable now'], waiting: ['รอ', 'Upcoming'], paid: ['จ่ายแล้ว', 'Paid'], skipped: ['ข้าม', 'Skipped'] };
const stName = s => L(...STATUS[s]);
const FIELDS = {
  car: [['plate', 'ทะเบียน', 'Plate no.'], ['province', 'จังหวัด', 'Province'], ['model', 'ยี่ห้อ/รุ่น', 'Make / model'], ['year', 'ปีจดทะเบียน', 'Registration year'], ['odometer', 'เลขไมล์ล่าสุด (กม.)', 'Odometer (km)', 'number']],
  moto: [['plate', 'ทะเบียน', 'Plate no.'], ['province', 'จังหวัด', 'Province'], ['model', 'ยี่ห้อ/รุ่น', 'Make / model'], ['year', 'ปีจดทะเบียน', 'Registration year'], ['odometer', 'เลขไมล์ล่าสุด (กม.)', 'Odometer (km)', 'number']],
  condo: [['project', 'โครงการ', 'Project'], ['unit', 'เลขห้อง', 'Unit no.'], ['size', 'ขนาด (ตร.ม.)', 'Size (sq.m.)', 'number']],
  house: [['address', 'ที่อยู่', 'Address'], ['deed', 'เลขโฉนด', 'Title deed no.']],
  land: [['deed', 'เลขโฉนด', 'Title deed no.'], ['area', 'เนื้อที่', 'Area']],
  policy: [['insurer', 'บริษัทประกัน', 'Insurer'], ['policyNo', 'เลขกรมธรรม์', 'Policy no.'], ['coverage', 'ความคุ้มครอง', 'Coverage']],
  other: [['desc', 'รายละเอียด', 'Description']]
};
// key, th, en, category, recurType, interval, reminders, payAhead, defaultOn, suggest
const T_LTAX = ['ltax', 'ภาษีที่ดินและสิ่งปลูกสร้าง', 'Land & building tax', 'tax', 'yearly', 1, [30, 7], 0, true, 'apr30'];
const T_FIRE = ['fire', 'ประกันอัคคีภัย', 'Fire insurance', 'insurance', 'yearly', 1, [30, 7], 0, true];
const T_LOAN = ['loan', 'ค่างวดสินเชื่อ', 'Loan installment', 'loan', 'monthly', 1, [5, 1], 0, false];
const TPL = {
  car: [['tax', 'ต่อภาษีรถประจำปี', 'Annual vehicle tax', 'tax', 'yearly', 1, [30, 7, 1], 90, true], ['cmi', 'พ.ร.บ.', 'Compulsory insurance (CMI)', 'insurance', 'yearly', 1, [30, 7], 0, true], ['ins', 'ประกันภาคสมัครใจ', 'Voluntary insurance', 'insurance', 'yearly', 1, [45, 14, 3], 0, true], ['insp', 'ตรวจสภาพรถ ตรอ.', 'Vehicle inspection', 'other', 'yearly', 1, [30, 7], 0, false], ['svc', 'เช็กระยะ', 'Scheduled service', 'maintenance', 'monthly', 6, [14, 3], 0, true], ['carloan', 'ค่างวดรถ', 'Car loan', 'loan', 'monthly', 1, [5, 1], 0, false]],
  moto: [['tax', 'ต่อภาษีรถประจำปี', 'Annual vehicle tax', 'tax', 'yearly', 1, [30, 7, 1], 90, true], ['cmi', 'พ.ร.บ.', 'Compulsory insurance (CMI)', 'insurance', 'yearly', 1, [30, 7], 0, true], ['svc', 'เช็กระยะ', 'Scheduled service', 'maintenance', 'monthly', 6, [14], 0, false]],
  condo: [['fee', 'ค่าส่วนกลาง', 'Common area fee', 'fee', 'yearly', 1, [30, 7], 0, true], T_LTAX, ['fire', 'ประกันห้องชุด/อัคคีภัย', 'Unit / fire insurance', 'insurance', 'yearly', 1, [30, 7], 0, true], T_LOAN],
  house: [T_LTAX, ['vfee', 'ค่าส่วนกลางหมู่บ้าน', 'Village fee', 'fee', 'yearly', 1, [30, 7], 0, true], T_FIRE, ['ac', 'ล้างแอร์', 'Air-con cleaning', 'maintenance', 'monthly', 6, [14], 0, false], T_LOAN],
  land: [T_LTAX],
  policy: [['prem', 'เบี้ยประกัน', 'Premium', 'insurance', 'yearly', 1, [30, 7, 1], 0, true]],
  other: []
};

/* ---------- IndexedDB ---------- */
const STORES = ['assets', 'obligations', 'dues', 'payments', 'maintenance', 'accounts', 'attachments', 'kv'];
const DATA_STORES = ['assets', 'obligations', 'dues', 'payments', 'maintenance', 'accounts'];
let db;
function openDB() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no-idb'));
    const r = indexedDB.open('myassets', 1);
    r.onupgradeneeded = () => { const d = r.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: s === 'kv' ? 'k' : 'id' }); }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const st = t.objectStore(store); let out;
    const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const dbAll = s => tx(s, 'readonly', st => st.getAll());
const dbGet = (s, id) => tx(s, 'readonly', st => st.get(id));
const dbPut = (s, v) => tx(s, 'readwrite', st => st.put(v));
const dbDel = (s, id) => tx(s, 'readwrite', st => st.delete(id));
const dbClear = s => tx(s, 'readwrite', st => st.clear());

/* ---------- state ---------- */
const S = { assets: [], obligations: [], dues: [], payments: [], maintenance: [], accounts: [], set: {} };
let lastChangeAt = 0; // last time any data record changed (saved to IndexedDB instantly)
async function loadAll() {
  for (const s of DATA_STORES) S[s] = await dbAll(s);
  S.set = {}; (await dbAll('kv')).forEach(r => { S.set[r.k] = r.v; });
}
async function save(store, obj, keepStamp) {
  const now = Date.now();
  if (!keepStamp) obj.updatedAt = now;
  if (!obj.createdAt) obj.createdAt = now;
  const arr = S[store]; const i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  await dbPut(store, obj); lastChangeAt = Date.now();
  return obj;
}
async function removeRec(store, id) { S[store] = S[store].filter(x => x.id !== id); await dbDel(store, id); lastChangeAt = Date.now(); }
async function setKV(k, v) { S.set[k] = v; await dbPut('kv', { k, v }); }

const byId = (store, id) => S[store].find(x => x.id === id);
const assetOf = ob => ob && byId('assets', ob.assetId);
const obOf = d => d && byId('obligations', d.obligationId);
const liveDues = () => S.dues.filter(d => !d.removed && obOf(d));

/* ---------- dues engine ---------- */
function genDates(ob) {
  const a = byId('assets', ob.assetId);
  if (!ob.active || ob.archived || !ob.firstDue || (a && a.status !== 'active')) return [];
  const horizon = addMonthsISO(todayISO(), 18);
  const step = ob.recurType === 'yearly' ? 12 * (ob.interval || 1) : (ob.interval || 1);
  const anchor = pd(ob.firstDue).getDate();
  const out = []; let n = 0; let d = ob.firstDue;
  while (d <= horizon && n < 600) {
    if (ob.endType === 'date' && ob.endDate && d > ob.endDate) break;
    if (ob.endType === 'count' && ob.endCount && n >= +ob.endCount) break;
    out.push(d); n++;
    if (ob.recurType === 'once') break;
    d = addMonthsISO(ob.firstDue, step * n, anchor);
  }
  return out;
}
async function syncDues(ob) {
  for (const date of genDates(ob)) {
    const id = ob.id + '_' + date;
    const ex = byId('dues', id);
    if (!ex) await save('dues', { id, obligationId: ob.id, dueDate: date, expectedAmount: +ob.amount || 0, skipped: false, paymentId: null, isSample: !!ob.isSample });
    else if (ex.removed) { ex.removed = false; ex.expectedAmount = +ob.amount || 0; await save('dues', ex); }
  }
}
// remove future unpaid dues that are not manually edited, then regenerate
async function regenDues(ob) {
  const t = todayISO();
  for (const d of S.dues.filter(x => x.obligationId === ob.id && !x.paymentId && !x.skipped && !x.overridden && !x.removed && x.dueDate >= t)) {
    await dropDue(d);
  }
  await syncDues(ob);
}
async function dropDue(d) {
  if (d.icsExportedAt) { d.removed = true; await save('dues', d); } else await removeRec('dues', d.id);
}
function dueStatus(d) {
  if (d.paymentId) return 'paid';
  if (d.skipped) return 'skipped';
  const ob = obOf(d); const left = diffDays(todayISO(), d.dueDate);
  if (left < 0) return 'overdue';
  const maxR = Math.max(0, ...((ob && ob.reminders) || []));
  if (left <= maxR) return 'soon';
  if (ob && ob.payAhead && left <= ob.payAhead) return 'open';
  return 'waiting';
}
const dueAmount = d => { if (d.paymentId) { const p = byId('payments', d.paymentId); if (p) return +p.amount || 0; } return +d.expectedAmount || 0; };
function annualized(ob) {

/* ---------- attachments ---------- */
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600; let w = img.naturalWidth, h = img.naturalHeight;
    const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}
async function addAttachment(file, isSample) {
  const blob = await compressImage(file);
  const rec = { id: uid(), blob, mime: blob.type || 'image/jpeg', size: blob.size, createdAt: Date.now(), isSample: !!isSample };
  await dbPut('attachments', rec); return rec.id;
}
const urlCache = {};
async function attUrl(id) {
  if (urlCache[id]) return urlCache[id];
  const r = await dbGet('attachments', id); if (!r) return '';
  return (urlCache[id] = URL.createObjectURL(r.blob));
}
async function hydrateImgs(root = document) {
  for (const img of $$('img[data-att]', root)) { if (!img.src) { const u = await attUrl(img.dataset.att); if (u) img.src = u; else img.remove(); } }
}
async function deleteAttachments(ids) { for (const id of ids || []) { await dbDel('attachments', id); if (urlCache[id]) { URL.revokeObjectURL(urlCache[id]); delete urlCache[id]; } } }

/* ---------- PIN ---------- */
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  if (window.crypto && crypto.subtle) {
    const h = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const b of data) h = ((h << 5) + h + b) >>> 0; return 'f' + h.toString(16);
}

/* ---------- shared bits ---------- */
const badge = st => `<span class="badge b-${st}">${stName(st)}</span>`;
function dueRow(d, withPay = true) {
  const ob = obOf(d), a = assetOf(ob), st = dueStatus(d), p = d.paymentId ? byId('payments', d.paymentId) : null;
  const left = diffDays(todayISO(), d.dueDate);
  const when = st === 'paid' ? L('จ่ายแล้ว', 'Paid') : st === 'overdue' ? L(`เกิน ${-left} วัน`, `${-left} days overdue`) : left === 0 ? L('วันนี้', 'Today') : L(`อีก ${left} วัน`, `in ${left} days`);
  const canPay = withPay && st !== 'paid' && st !== 'skipped';
  const id = esc(d.id);
  return `<details class="drow"><summary class="row">
    <div class="row-ic">${assetIcon(a)}</div>
    <div class="row-main"><div class="row-t">${esc(ob.title)}</div><div class="row-s">${esc(a?.name || '')} · ${fmtDate(d.dueDate)} · ${when}</div></div>
    <div class="row-r"><div class="amt num">${fmtMoney(dueAmount(d))}</div>${canPay ? `<button class="btn sm gold" data-act="quickPay" data-id="${id}" style="margin-top:4px">${L('จ่ายแล้ว', 'Mark paid')}</button>` : badge(st)}</div><span class="chev" aria-hidden="true"></span></summary>
    <div class="drow-b"><dl class="kv">

      <dt>${p ? L('จ่ายจากบัญชี', 'Paid from') : L('บัญชีที่ตั้งไว้', 'Pay from')}</dt><dd>${esc(accName(p ? p.accountId : ob.accountId))}${ob.autoDebit ? ' · ' + L('หักอัตโนมัติ', 'auto-debit') : ''}</dd>
      ${p ? `<dt>${L('จ่ายเมื่อ', 'Paid on')}</dt><dd>${fmtDate(p.paidDate, true)}</dd>${p.reference ? `<dt>${L('อ้างอิง', 'Reference')}</dt><dd>${esc(p.reference)}</dd>` : ''}` : `<dt>${L('ยอดที่คาด', 'Expected')}</dt><dd class="num">${fmtMoney(d.expectedAmount)}${ob.amountMode === 'estimate' ? ' ' + L('(ประมาณ)', '(est.)') : ''}</dd>`}
      ${a?.ownerName ? `<dt>${L('ในนามของ', 'Owner')}</dt><dd>${esc(a.ownerName)}</dd>` : ''}
      ${(p?.note || ob.note) ? `<dt>${L('หมายเหตุ', 'Notes')}</dt><dd>${esc(p?.note || ob.note)}</dd>` : ''}</dl>
      ${p && (p.attachmentIds || []).length ? `<div class="thumbs">${p.attachmentIds.map(x => `<img class="thumb" data-att="${esc(x)}" data-act="viewAtt" data-id="${esc(x)}" data-ro="1" alt="">`).join('')}</div>` : ''}
      <div class="chips" style="margin-top:10px">${p ? `<button class="btn sm" data-act="payForm" data-id="${id}">${L('แก้ไขการจ่าย', 'Edit payment')}</button>` : st === 'skipped' ? '' : `<button class="btn sm gold" data-act="payForm" data-id="${id}">${L('บันทึกการจ่าย + แนบรูป', 'Record payment + photo')}</button><button class="btn sm" data-act="editDue" data-id="${id}">${L('แก้วัน/ยอด', 'Edit date/amount')}</button>`}${a ? `<a class="btn sm" href="#asset/${encodeURIComponent(a.id)}">${L('ไปที่ทรัพย์สิน', 'Go to asset')}</a>` : ''}<button class="btn sm ghost" data-act="openDue" data-id="${id}">${L('ตัวเลือกเพิ่มเติม', 'More options')}</button></div></div></details>`;
}
function disc(d) {
  const ob = obOf(d), a = assetOf(ob), st = dueStatus(d), left = diffDays(todayISO(), d.dueDate);
  const win = Math.max(30, ...(ob.reminders || [0]));
  const p = st === 'overdue' ? 1 : Math.max(0.04, Math.min(1, 1 - left / win));
  const big = st === 'overdue' ? -left : left;
  const small = st === 'overdue' ? L('วันที่เกิน', 'days late') : left === 0 ? L('ครบวันนี้', 'due today') : L('วัน', 'days');
  return `<button class="disc s-${st}" data-act="openDue" data-id="${esc(d.id)}" aria-label="${esc(ob.title)} ${fmtDate(d.dueDate)}">
    <div class="disc-ring" style="--p:${p.toFixed(3)}"><div class="disc-face"><i>${fmtDate(d.dueDate)}</i><b class="num">${big}</b><span>${small}</span></div></div>
    <div class="disc-cap">${esc(ob.title)}<small>${esc(a?.name || '')}</small></div><div class="disc-amt num">${fmtMoney(d.expectedAmount)}</div></button>`;
}

/* ---------- dues list ---------- */
function viewDues() {
  const t = todayISO(), f = ui.duesFilter, aid = ui.duesAsset;
  let list = liveDues();
  if (aid) list = list.filter(d => obOf(d).assetId === aid);
  const fl = { open: d => !d.paymentId && !d.skipped, overdue: d => dueStatus(d) === 'overdue', d7: d => !d.paymentId && !d.skipped && d.dueDate >= t && diffDays(t, d.dueDate) <= 7, d30: d => !d.paymentId && !d.skipped && d.dueDate >= t && diffDays(t, d.dueDate) <= 30, paid: d => !!d.paymentId, all: () => true };
  list = list.filter(fl[f] || fl.open).sort((a, b) => f === 'paid' ? b.dueDate.localeCompare(a.dueDate) : a.dueDate.localeCompare(b.dueDate));
  const chips = [['open', L('ยังไม่จ่าย', 'Unpaid')], ['overdue', L('เกินกำหนด', 'Overdue')], ['d7', L('7 วัน', '7 days')], ['d30', L('30 วัน', '30 days')], ['paid', L('จ่ายแล้ว', 'Paid')], ['all', L('ทั้งหมด', 'All')]];
  let html = '', cur = '';
  for (const d of list) {
    const k = d.dueDate.slice(0, 7);
    if (k !== cur) { if (cur) html += '</div>'; cur = k; html += `<div class="month-h">${fmtMonthY(+k.slice(0, 4), +k.slice(5, 7) - 1)}</div><div class="rows">`; }
    html += dueRow(d, f !== 'paid');
  }
  if (cur) html += '</div>';
  return `<div class="page-head"><div><a href="#home" class="link">${L('‹ หน้าหลัก', '‹ Home')}</a><h1 style="margin-top:6px">${L('งวดทั้งหมด', 'All payments')}</h1></div>
    <select class="btn" data-change="duesAsset" aria-label="${L('กรองตามทรัพย์สิน', 'Filter by asset')}">${opt('', L('ทุกทรัพย์สิน', 'All assets'), aid)}${S.assets.map(a => opt(a.id, a.name, aid)).join('')}</select></div>
  <div class="chips">${chips.map(c => `<button class="chip ${f === c[0] ? 'on' : ''}" data-act="duesFilter" data-f="${c[0]}">${c[1]}</button>`).join('')}</div>
  ${html || `<div style="margin-top:14px">${emptyBox(L('ไม่มีรายการตามตัวกรองนี้', 'Nothing matches this filter'))}</div>`}`;
}

/* ---------- calendar ---------- */
function viewCalendar() {
  const now = new Date();
  if (ui.calY == null) { ui.calY = now.getFullYear(); ui.calM = now.getMonth(); }
  const y = ui.calY, m = ui.calM, t = todayISO();
  const first = new Date(y, m, 1); const startDow = (first.getDay() + 6) % 7; // Monday first
  const start = addDaysISO(iso(first), -startDow);
  const map = {}; liveDues().filter(d => !d.skipped).forEach(d => (map[d.dueDate] = map[d.dueDate] || []).push(d));
  const dows = lang === 'en' ? ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] : ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'];
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const ds = addDaysISO(start, i), dd = pd(ds); const list = map[ds] || [];
    if (i >= 35 && dd.getMonth() !== m) break;
    cells += `<button class="cal-d ${dd.getMonth() !== m ? 'out' : ''} ${ds === t ? 'today' : ''} ${ds === ui.calSel ? 'sel' : ''}" data-act="calSel" data-d="${ds}" aria-label="${fmtDate(ds, true)}${list.length ? ', ' + list.length + ' ' + L('รายการ', 'items') : ''}"><span class="num">${dd.getDate()}</span><span class="dots">${list.slice(0, 4).map(d => `<i class="dot ${dueStatus(d)}"></i>`).join('')}</span></button>`;
  }
  const sel = ui.calSel; const selList = sel ? (map[sel] || []) : [];
  const monthList = liveDues().filter(d => !d.skipped && d.dueDate.slice(0, 7) === `${y}-${pad(m + 1)}`).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  return `<div class="page-head"><h1>${L('ปฏิทินการจ่าย', 'Payment calendar')}</h1><button class="btn" data-act="openIcs">${IC.calendar}${L('ส่งออกเข้าปฏิทินมือถือ', 'Export to phone calendar')}</button></div>
  <div class="card"><div class="cal-head"><button class="icon-btn" data-act="calNav" data-d="-1" aria-label="${L('เดือนก่อน', 'Previous month')}">${IC.back}</button><h2>${fmtMonthY(y, m)}</h2><button class="icon-btn" data-act="calNav" data-d="1" aria-label="${L('เดือนถัดไป', 'Next month')}" style="transform:scaleX(-1)">${IC.back}</button></div>
   <div class="cal">${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
   <div class="legend"><span><i style="background:var(--red)"></i>${stName('overdue')}</span><span><i style="background:var(--gold)"></i>${stName('soon')}</span><span><i style="background:var(--blue)"></i>${stName('open')}</span><span><i style="background:var(--grey)"></i>${stName('waiting')}</span><span><i style="background:var(--green)"></i>${stName('paid')}</span></div></div>
  <div class="section"><div class="section-h"><h2>${sel ? fmtDate(sel, true) : L('รายการในเดือนนี้', 'This month')}</h2>${sel ? `<button class="link" data-act="calSel" data-d="">${L('ดูทั้งเดือน', 'Show whole month')}</button>` : ''}</div>
   ${(sel ? selList : monthList).length ? `<div class="rows">${(sel ? selList : monthList).map(d => dueRow(d)).join('')}</div>` : emptyBox(L('ไม่มีรายการ', 'Nothing scheduled'))}</div>`;
}

const dimNames = () => ({ cat: L('หมวด', 'Category'), asset: L('ทรัพย์สิน', 'Asset'), account: L('บัญชี', 'Account'), owner: L('ผู้ถือกรรมสิทธิ์', 'Owner'), type: L('ประเภททรัพย์สิน', 'Asset type'), month: L('เดือน', 'Month'), status: L('สถานะ', 'Status') });
function dimOf(e, dim) {
  switch (dim) {
    case 'cat': return [e.cat, catName(e.cat)];
    case 'asset': return [e.a?.id || '', e.a?.name || '–'];
    case 'account': return [e.accountId || '', accName(e.accountId)];
    case 'owner': { const o = e.a?.ownerName || ''; return [o, o || L('ตัวเอง', 'Myself')]; }
    case 'type': return [e.a?.type || 'other', typeName(e.a?.type || 'other')];

    case 'status': return [e.status, stName(e.status)];
    default: return [e.ob ? e.ob.id : e.id, e.title + (e.a ? ' · ' + e.a.name : '')];
  }
}
function groupBy(list, dim) {
  const m = new Map();
  for (const e of list) { const [k, l] = dimOf(e, dim); if (!m.has(k)) m.set(k, { key: k, label: l, v: 0, n: 0, items: [] }); const g = m.get(k); g.v += e.amount; g.n++; g.items.push(e); }
  return [...m.values()].sort((a, b) => dim === 'month' ? a.key.localeCompare(b.key) : b.v - a.v);
}
const colorFor = (dim, key, i) => dim === 'cat' ? (CAT_COLOR[key] || PALETTE[i % PALETTE.length]) : PALETTE[i % PALETTE.length];
const pct = (v, t) => t ? (v / t * 100) : 0;

/* squarified treemap layout on a w×h box */
function squarify(items, x, y, w, h) {
  const out = []; const total = items.reduce((s, i) => s + i.v, 0); if (!total) return out;
  const scale = w * h / total; const nodes = items.map(i => Object.assign({}, i, { a: i.v * scale }));
  const worst = (row, len) => { const s = row.reduce((a, r) => a + r.a, 0); const mx = Math.max(...row.map(r => r.a)), mn = Math.min(...row.map(r => r.a)); return Math.max(len * len * mx / (s * s), (s * s) / (len * len * mn)); };
  const layout = row => {
    const s = row.reduce((a, r) => a + r.a, 0);
    if (w >= h) { const cw = s / h; let cy = y; row.forEach(r => { const rh = r.a / cw; out.push(Object.assign(r, { x, y: cy, w: cw, h: rh })); cy += rh; }); x += cw; w -= cw; }
    else { const rh = s / w; let cx = x; row.forEach(r => { const rw = r.a / rh; out.push(Object.assign(r, { x: cx, y, w: rw, h: rh })); cx += rw; }); y += rh; h -= rh; }
  };
  let row = [];
  while (nodes.length) { const len = Math.min(w, h); const n = nodes[0]; if (!row.length || worst([...row, n], len) <= worst(row, len)) { row.push(n); nodes.shift(); } else { layout(row); row = []; } }
  if (row.length) layout(row);
  return out;
}

async function cleanupOrphans() {
  const used = new Set();
  S.assets.forEach(a => { (a.attachmentIds || []).forEach(i => used.add(i)); if (a.coverId) used.add(a.coverId); });
  S.payments.forEach(p => (p.attachmentIds || []).forEach(i => used.add(i)));
  S.maintenance.forEach(m => (m.attachmentIds || []).forEach(i => used.add(i)));
  const all = await dbAll('attachments');
  for (const r of all) if (!used.has(r.id) && Date.now() - (r.createdAt || 0) > 864e5) await dbDel('attachments', r.id);

  const fields = (FIELDS[a.type] || []).map(f => `${L(f[1], f[2])}: ${esc(a.details?.[f[0]] || '–')}`).join(' · ');
  const body = `<p>${typeName(a.type)} · ${fields}</p>` + tbl([[L('วันที่', 'Date')], [L('ประเภท', 'Type')], [L('เลขไมล์', 'Odometer')], [L('รายการ', 'Work done')], [L('ผู้ให้บริการ', 'Provider')], [L('ค่าใช้จ่าย', 'Cost'), 'r']],
    ms.map(m => `<tr><td>${fmtDate(m.date)}</td><td>${MK(m.kind)}</td><td>${m.odometer ? Number(m.odometer).toLocaleString() : '–'}</td><td>${(m.items || []).map(i => esc(i.desc)).join('<br>')}${m.note ? '<br><i>' + esc(m.note) + '</i>' : ''}</td><td>${esc(m.provider || '')}</td><td class="r num">${fmtMoney(m.totalCost)}</td></tr>`),
    `<tr><th colspan="5">${L('รวม', 'Total')}</th><th class="r num">${fmtMoney(ms.reduce((s, m) => s + (+m.totalCost || 0), 0))}</th></tr>`);

function download(name, content, mime) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}

function icsText(s) { return String(s ?? '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsFold(line) { const out = []; let cur = ''; for (const ch of line) { if (new TextEncoder().encode(cur + ch).length > 73) { out.push(cur); cur = ' ' + ch; } else cur += ch; } out.push(cur); return out.join('\r\n'); }
function buildIcs(list) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Nattapol P.//MyAssets ' + VERSION + '//' + lang.toUpperCase(), 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:MyAssets'];
  for (const d of list) {
    const ob = obOf(d), a = assetOf(ob); const cancel = d.removed || d.paymentId || d.skipped;
    const summary = `[${a?.name || ''}] ${ob.title} – ${fmtMoney(d.expectedAmount)}`;
    const desc = `${L('ครบกำหนด', 'Due')} ${fmtDate(d.dueDate, true)}\n${L('จ่ายจาก', 'Pay from')}: ${accName(ob.accountId)}${ob.autoDebit ? ' (' + L('หักอัตโนมัติ', 'auto-debit') + ')' : ''}${ob.note ? '\n' + ob.note : ''}\n— MyAssets`;
    lines.push('BEGIN:VEVENT', `UID:${d.id}@myassets`, `DTSTAMP:${stamp}`, `SEQUENCE:${Math.max(0, Math.floor(((d.updatedAt || 0) - 1.7e12) / 1000))}`,
      `DTSTART;VALUE=DATE:${d.dueDate.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDaysISO(d.dueDate, 1).replace(/-/g, '')}`,
      icsFold('SUMMARY:' + icsText(summary)), icsFold('DESCRIPTION:' + icsText(desc)), `STATUS:${cancel ? 'CANCELLED' : 'CONFIRMED'}`, 'TRANSP:TRANSPARENT');
    if (!cancel) for (const n of (ob.reminders || [])) {
      const trig = n >= 1 ? `-P${n - 1}DT15H` : 'PT9H';
      lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsText(summary)), `TRIGGER:${trig}`, 'END:VALARM');
    }
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n') + '\r\n';
}

const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
function dataURLToBlob(u) { const [h, b64] = u.split(','); const mime = (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream'; const bin = atob(b64); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], { type: mime }); }
/* file backup: manual (choose name/location) + automatic to a chosen folder */

const fsSupported = () => 'showDirectoryPicker' in window;
const ymd = () => todayISO().replace(/-/g, '');
function nextBackupName() { const s = S.set.backupSeq || {}; const n = s.date === ymd() ? s.n + 1 : 1; return `MyAssetData-${ymd()}-${pad(n)}`; }
async function commitSeq() { const s = S.set.backupSeq || {}; const n = s.date === ymd() ? s.n + 1 : 1; await setKV('backupSeq', { date: ymd(), n }); }
async function buildBackup(withImg) {
  const data = {}; for (const s of DATA_STORES) data[s] = S[s];
  const kv = Object.fromEntries(Object.entries(S.set).filter(([k]) => !['pin', 'consent', 'backupDir', 'backupSeq', 'lastAutoBackup'].includes(k)));
  const atts = [];
  if (withImg) for (const r of await dbAll('attachments')) atts.push({ id: r.id, mime: r.mime, size: r.size, createdAt: r.createdAt, isSample: r.isSample, data: await blobToDataURL(r.blob) });
  return JSON.stringify({ app: 'MyAssets', format: 1, version: VERSION, exportedAt: new Date().toISOString(), data, kv, attachments: atts });
}

setInterval(async () => {
  updateDataBar();
  const ab = S.set.autoBackup || { interval: 1 };
  if (autoBusy || !ab.interval || !backupDir || dirPerm !== 'granted' || !S.set.started || locked) return;
  if (lastChangeAt <= (S.set.lastBackup || 0)) return;
  if (Date.now() - (S.set.lastAutoBackup || 0) < ab.interval * 60000) return;
  autoBusy = true;
  try {
    const name = nextBackupName() + '.json';
    const fh = await backupDir.getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write(await buildBackup(!!ab.withImages)); await w.close();
    await commitSeq(); const now = Date.now(); await setKV('lastBackup', now); await setKV('lastAutoBackup', now); updateDataBar();
  } catch (e) { console.warn('auto backup', e); dirPerm = 'prompt'; updateDataBar(); }
  finally { autoBusy = false; }
}, 15000);

async function doRestore(file, mode) {
  if (!file) return;
  let j; try { j = JSON.parse(await file.text()); } catch { toast(L('อ่านไฟล์ไม่ได้ ต้องเป็นไฟล์สำรองของ MyAssets', 'Could not read the file. It must be a MyAssets backup.')); return; }
  if (j.app !== 'MyAssets' || !j.data) { toast(L('ไฟล์นี้ไม่ใช่ไฟล์สำรองของ MyAssets', 'This is not a MyAssets backup file')); return; }
  if (mode === 'replace' && !confirm(L('แทนที่ข้อมูลทั้งหมดในเครื่องนี้ด้วยไฟล์สำรอง?', 'Replace all data on this device with the backup?'))) return;
  if (mode === 'replace') { for (const s of DATA_STORES) await dbClear(s); await dbClear('attachments'); }
  for (const s of DATA_STORES) for (const r of (j.data[s] || [])) {
    if (!r || !r.id) continue;
    if (mode === 'merge') { const cur = await dbGet(s, r.id); if (cur && (cur.updatedAt || 0) >= (r.updatedAt || 0)) continue; }
    await dbPut(s, r);
  }
  for (const a of (j.attachments || [])) { try { if (mode === 'merge' && await dbGet('attachments', a.id)) continue; await dbPut('attachments', { id: a.id, blob: dataURLToBlob(a.data), mime: a.mime, size: a.size, createdAt: a.createdAt || Date.now(), isSample: !!a.isSample }); } catch { } }
  for (const [k, v] of Object.entries(j.kv || {})) if (!['pin', 'consent', 'lastBackup', 'lastIcs'].includes(k)) await dbPut('kv', { k, v });
  await dbPut('kv', { k: 'started', v: true });
  await loadAll(); for (const o of S.obligations) await syncDues(o);
  closeSheet(); render(); toast(L('กู้คืนข้อมูลแล้ว', 'Data restored'));
}

/* ---------- PIN lock ---------- */
let locked = false, hiddenAt = 0, pinTries = 0, pinWait = 0;
function lockScreen(mode, onDone) {
  // mode: 'unlock' | 'set1' | 'set2'
  $('#lock')?.remove(); let entry = ''; const w = document.createElement('div'); w.id = 'lock'; w.className = 'lock';
  const len = mode === 'unlock' ? (S.set.pin?.len || 4) : 6;
  const title = mode === 'unlock' ? L('ใส่ PIN เพื่อเปิด MyAssets', 'Enter PIN to open MyAssets') : mode === 'set1' ? L('ตั้ง PIN 4–6 หลัก', 'Choose a 4–6 digit PIN') : L('ใส่ PIN อีกครั้งเพื่อยืนยัน', 'Enter the PIN again to confirm');
  const draw = () => {
    w.innerHTML = `${brandMark()}<div style="font-size:17px;font-weight:600;text-align:center">${title}</div><div class="pin-dots">${Array.from({ length: mode === 'unlock' ? len : Math.max(4, entry.length) }, (_, i) => `<i class="${i < entry.length ? 'f' : ''}"></i>`).join('')}</div><div id="pinMsg" style="min-height:20px;font-size:13px;color:#F5C2BD"></div>
     <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="key" data-k="${n}">${n}</button>`).join('')}<button class="key plain" data-k="x">${mode === 'unlock' ? L('ลืม PIN', 'Forgot') : L('ยกเลิก', 'Cancel')}</button><button class="key" data-k="0">0</button><button class="key plain" data-k="b">⌫</button></div>
     ${mode !== 'unlock' ? `<button class="btn gold" data-k="ok" ${entry.length >= 4 ? '' : 'disabled'}>${L('ตกลง', 'OK')}</button>` : ''}`;
    $('.brand-mark', w).style.cssText = 'width:56px;height:56px';
  };
  const press = async k => {
    const msg = () => $('#pinMsg', w);
    if (k === 'b') { entry = entry.slice(0, -1); draw(); return; }
    if (k === 'x') { if (mode === 'unlock') forgotPin(); else { w.remove(); } return; }
    if (k === 'ok') { if (entry.length >= 4) { const e = entry; w.remove(); onDone(e); } return; }
    if (entry.length >= (mode === 'unlock' ? len : 6)) return;
    entry += k; draw();
    if (mode === 'unlock' && entry.length === len) {
      if (Date.now() < pinWait) { entry = ''; draw(); msg().textContent = L('รอสักครู่แล้วลองใหม่', 'Please wait and try again'); return; }
      const h = await hashPin(entry, S.set.pin.salt);
      if (h === S.set.pin.hash) { pinTries = 0; locked = false; w.remove(); onDone && onDone(); }
      else { pinTries++; entry = ''; draw(); $('.pin-dots', w).classList.add('shake'); if (pinTries >= 5) { pinWait = Date.now() + 30000; pinTries = 0; msg().textContent = L('ใส่ผิด 5 ครั้ง รอ 30 วินาที', '5 wrong attempts. Wait 30 seconds.'); } else msg().textContent = L('PIN ไม่ถูกต้อง', 'Wrong PIN'); }
    }
  };
  w.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b && !b.disabled) press(b.dataset.k); });
  w._key = e => { if (!document.body.contains(w)) return document.removeEventListener('keydown', w._key); if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('b'); else if (e.key === 'Enter' && mode !== 'unlock') press('ok'); };
  document.addEventListener('keydown', w._key);
  draw(); document.body.appendChild(w);
}
function lockNow() { if (!S.set.pin) return; locked = true; closeSheet(); lockScreen('unlock', () => {}); }
function forgotPin() {
  if (!confirm(L('ลืม PIN ไม่มีทางรีเซ็ต ทางเดียวคือลบข้อมูลทั้งหมดในเครื่องนี้ แล้วกู้คืนจากไฟล์สำรอง ต้องการลบข้อมูลทั้งหมดไหม?', 'A forgotten PIN cannot be reset. The only way is to erase all data on this device and restore from a backup. Erase everything?'))) return;
  const typed = prompt(L('พิมพ์คำว่า ลบ เพื่อยืนยัน', 'Type DELETE to confirm'));
  if (typed !== L('ลบ', 'DELETE')) return;
  eraseEverything();
}
function pinSettings() {
  if (!S.set.pin) {
    sheet(L('PIN ล็อกแอป', 'App PIN lock'), `<p style="margin-top:0">${L('เมื่อตั้ง PIN แอปจะถาม PIN ทุกครั้งที่เปิด และเมื่อกลับมาหลังไม่ได้ใช้เกิน 5 นาที', 'With a PIN, the app asks for it every time it opens and after 5 minutes away.')}</p>
     <div class="banner warn small">${L('PIN เป็นตัวล็อกหน้าจอเพื่อกันคนทั่วไปเปิดดู ไม่ใช่การเข้ารหัสข้อมูล และถ้าลืม PIN จะรีเซ็ตไม่ได้ ต้องลบข้อมูลแล้วกู้คืนจากไฟล์สำรอง', 'The PIN is a screen lock against casual viewing, not data encryption. A forgotten PIN cannot be reset: you would erase the data and restore from a backup.')}</div>
     <button type="button" class="btn primary" data-act="setPin">${L('ตั้ง PIN', 'Set PIN')}</button>`);
  } else {

  }
}
function setPin() {
  const go = () => { closeSheet(); lockScreen('set1', p1 => lockScreen('set2', async p2 => { if (p1 !== p2) { toast(L('PIN สองครั้งไม่ตรงกัน ลองใหม่', 'PINs did not match. Try again.')); return; } const salt = uid(); await setKV('pin', { salt, hash: await hashPin(p1, salt), len: p1.length }); render(); toast(L('ตั้ง PIN แล้ว', 'PIN set')); })); };
  if (S.set.pin) { closeSheet(); lockScreen('unlock', go); } else go();
}
function removePin() { closeSheet(); lockScreen('unlock', async () => { S.set.pin = null; await dbDel('kv', 'pin'); delete S.set.pin; render(); toast(L('ปิด PIN แล้ว', 'PIN turned off')); }); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();

});

async function eraseEverything() {
  for (const s of STORES) await dbClear(s);
  Object.keys(urlCache).forEach(k => { URL.revokeObjectURL(urlCache[k]); delete urlCache[k]; });
  for (const s of DATA_STORES) S[s] = []; S.set = {}; locked = false; $('#lock')?.remove(); closeSheet(); welcomeSeen = false; backupDir = null; lastChangeAt = 0; location.hash = '#home'; render();
}

}
/* ---------- actions ---------- */
const ACT = {
  toggleLang: async () => { lang = lang === 'th' ? 'en' : 'th'; await setKV('lang', lang); render(); },
  lockNow, openIcs, openData: () => { if (backupDir && dirPerm !== 'granted' && fsSupported()) grantDir().then(openData); else openData(); }, backupNow, openRestore, pickDir, grantDir, openBackup: openData, pinSettings, setPin, removePin, showTerms, exportCsv,
  newAsset: () => assetForm(null),
  editAsset: d => assetForm(byId('assets', d.id)),
  deleteAsset: d => deleteAsset(d.id),
  tplPicker: d => tplPicker(byId('assets', d.id)),
  newOb: d => obForm(null, d.id),
  editOb: d => obForm(byId('obligations', d.id)),
  deleteOb: d => deleteOb(d.id),
  openDue: d => openDue(d.id),
  quickPay: (d, el, e) => { e.preventDefault(); e.stopPropagation(); quickPay(d.id); },
  payForm: d => payForm(d.id),
  unpay: d => unpay(d.id),
  editDue: d => editDue(d.id),
  skipDue: d => skipDue(d.id),
  newMaint: d => maintForm(null, d.id),
  editMaint: d => maintForm(byId('maintenance', d.id)),
  deleteMaint: d => deleteMaint(d.id),
  printMaint: d => printMaint(d.id),
  viewAtt: (d, el, e) => { e.stopPropagation(); viewAtt(d.id, d.ro ? null : el); },
  editAcc: d => editAcc(d.id),
  assetTab: d => { ui.assetTab = d.t; render(); },
  dashPeriod: d => { ui.dash.period = d.p; ui.dash.drill = null; render(); },
  tmDrill: d => { ui.dash.drill = d.k; render(); },
  tmUp: () => { ui.dash.drill = null; render(); },
  goAsset: d => { location.hash = '#asset/' + encodeURIComponent(d.id); },
  repGo: d => { ui.rep.type = d.t; ui.rep.period = 'year'; ui.rep.year = new Date().getFullYear(); },
  printReport,
  duesFilter: d => { ui.duesFilter = d.f; render(); },
  goDues: d => { ui.duesFilter = d.f; ui.duesAsset = ''; location.hash = '#dues'; },
  calNav: d => { ui.calM += +d.d; if (ui.calM < 0) { ui.calM = 11; ui.calY--; } if (ui.calM > 11) { ui.calM = 0; ui.calY++; } ui.calSel = null; render(); },
  calSel: d => { ui.calSel = d.d || null; render(); },
  wStep: d => { ui.welcomeStep = Math.max(0, ui.welcomeStep + +d.d); render(); window.scrollTo(0, 0); },
  enterApp: async () => { const h = $('#ckHide')?.checked; if (h) await setKV('hideWelcome', true); welcomeSeen = true; render(); },
  toggleWelcome: async () => { await setKV('hideWelcome', !S.set.hideWelcome); render(); },
  reloadSample: async () => { if (!confirm(L('โหลดข้อมูลตัวอย่าง? ข้อมูลของคุณยังอยู่ครบ', 'Load sample data? Your own data stays as it is.'))) return; await loadSample(); location.hash = '#home'; render(); toast(L('โหลดข้อมูลตัวอย่างแล้ว', 'Sample data loaded')); },
  acceptTerms: async () => { if ($('#ckHide')?.checked) await setKV('hideWelcome', true); welcomeSeen = true; await setKV('consent', { version: TERMS_VERSION, at: Date.now() }); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch { } render(); },
  startSample: async () => { await setKV('owner', $('#ownerIn')?.value.trim() || ''); await loadSample(); location.hash = '#home'; render(); toast(L('โหลดข้อมูลตัวอย่างแล้ว', 'Sample data loaded')); },
  startFresh: async () => { await setKV('owner', $('#ownerIn')?.value.trim() || ''); await setKV('started', true); location.hash = '#home'; render(); },
  clearSample: async () => { if (!confirm(L('ลบข้อมูลตัวอย่างทั้งหมด? ข้อมูลที่คุณเพิ่มเองยังอยู่', 'Remove all sample data? Your own data stays.'))) return; await clearSample(); render(); toast(L('ล้างข้อมูลตัวอย่างแล้ว', 'Sample data cleared')); },
  editOwner: () => sheet(L('ชื่อเจ้าของข้อมูล', 'Owner name'), `<div class="f"><label for="ow">${L('ชื่อ', 'Name')}</label><input id="ow" name="owner" value="${esc(S.set.owner || '')}"></div>`, { submit: async f => { await setKV('owner', fv(f, 'owner')); } }),
  eraseAll: () => { if (!confirm(L('ลบข้อมูลทั้งหมดในอุปกรณ์นี้? กู้คืนได้จากไฟล์สำรองเท่านั้น', 'Erase all data on this device? Only a backup file can restore it.'))) return; const t = prompt(L('พิมพ์คำว่า ลบ เพื่อยืนยัน', 'Type DELETE to confirm')); if (t === L('ลบ', 'DELETE')) eraseEverything(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A' && !el.getAttribute('href')) e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape') { if ($('.sheet-wrap')) closeSheet(); } });
document.addEventListener('change', async e => {
  if (e.target.dataset.cover && e.target.files[0]) {
    const a = byId('assets', e.target.dataset.cover); if (!a) return;
    try { const id = await addAttachment(e.target.files[0]); const old = a.coverId; a.coverId = id; await save('assets', a); if (old) await deleteAttachments([old]); render(); toast(L('อัปเดตรูปแล้ว', 'Photo updated')); } catch { toast(L('อ่านไฟล์รูปไม่ได้', 'Could not read that image')); }
    return;
  }
  const k = e.target.dataset.change; if (!k) return;
  if (k === 'duesAsset') { ui.duesAsset = e.target.value; render(); }
  if (k === 'dashDim') { ui.dash.dim = e.target.value; ui.dash.drill = null; render(); }
  if (k.startsWith('rep:')) { const key = k.slice(4); let v = e.target.value; if (key === 'year' || key === 'q') v = +v; if (key === 'month' && !v) return; ui.rep[key] = v; if (key === 'type' && v === 'due') ui.rep.period = 'month'; render(); }
  if (k === 'consentCk') { const b = $('#startBtn'); if (b) b.disabled = !$('#ck1').checked; }
});
let qTimer;
document.addEventListener('input', e => {
  if (e.target.dataset.input === 'maintQ') { clearTimeout(qTimer); const v = e.target.value; qTimer = setTimeout(() => { ui.maintQ = v; render(); const i = $('[data-input=maintQ]'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 250); }
});

/* ---------- boot ---------- */
(async function boot() {
  parseHash();
  try { db = await openDB(); } catch (e) {
    $('#root').innerHTML = `<div class="welcome"><div class="w-card"><h1>เปิดที่เก็บข้อมูลไม่ได้ / Storage unavailable</h1><p>เบราว์เซอร์นี้ไม่อนุญาตให้เก็บข้อมูล (อาจเป็นโหมดไม่ระบุตัวตน) กรุณาเปิดด้วยเบราว์เซอร์ปกติ<br>This browser does not allow local storage (private mode?). Please open MyAssets in a normal window.</p></div></div>`;
    return;
  }
  await loadAll();
  lang = S.set.lang || 'th';
  for (const s of DATA_STORES) for (const r of S[s]) if ((r.updatedAt || 0) > lastChangeAt) lastChangeAt = r.updatedAt;
  backupDir = S.set.backupDir && S.set.backupDir.getFileHandle ? S.set.backupDir : null;
  if (backupDir) { try { dirPerm = await backupDir.queryPermission({ mode: 'readwrite' }); } catch { dirPerm = 'prompt'; } }
  for (const o of S.obligations) await syncDues(o);
  render();
  if (S.set.pin && S.set.consent) { locked = true; lockScreen('unlock', () => {}); }
  setTimeout(() => cleanupOrphans().catch(() => {}), 4000);
})();
</script>
